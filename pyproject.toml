[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraud-ring-detection"
version = "0.0.1"
description = "Seeded simulator, reference detector and evaluation harness for coordinated fraud rings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=0.10",
    "polars>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The learned rule, its grade and the learning curve.
ml = ["scikit-learn>=1.4", "lightgbm>=4.0"]
# The Triage + Investigate viewer (`fraudrings view`). Kept out of the lean core. Streamlit for
# multipage navigation and native st.plotly_chart(on_select=…) (lasso to re-seed); networkx lays out
# the linkage subgraph.
viz = ["streamlit>=1.50", "pandas>=2.0", "plotly>=5.0", "networkx>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "pyright>=1.1"]
# Screenshot tooling for the docs (scripts/capture_ui.py).
docs = ["websocket-client>=1.7", "pillow>=10.1", "matplotlib>=3.8"]
# The static project site (scripts/build_site.py).
site = ["markdown-it-py>=3", "jinja2>=3.1"]

[project.scripts]
fraudrings = "fraudrings.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudrings"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# Standard now; tighten to "strict" as third-party stubs (duckdb/polars) allow — see README/open-items.
typeCheckingMode = "standard"
pythonVersion = "3.11"
# Resolve third-party imports from the project venv (see README bootstrap).
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
